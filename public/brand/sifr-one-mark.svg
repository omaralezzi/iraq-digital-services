    <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#35D7F8"/><stop offset="1" stop-color="#19BFEA"/></linearGradient>
    <linearGradient id="amber" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#F8C65B"/><stop offset="1" stop-color="#F1B54B"/></linearGradient>
  </defs>
  <circle cx="270" cy="280" r="210" fill="none" stroke="url(#navy)" stroke-width="82"/>
  <path fill="url(#cyan)" d="M515 185 650 92h72v391h-98V220l-109 70Z"/>
