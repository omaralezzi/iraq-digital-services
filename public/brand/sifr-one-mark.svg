<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" role="img" aria-labelledby="title desc">
  <title id="title">sifr.one mark</title>
  <desc id="desc">A complete zero joined to the numeral one by an amber dot.</desc>
